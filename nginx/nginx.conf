# =============================================================
# DayCraft Nginx Load Balancer Configuration
# Routes traffic across 3 API instances (round-robin)
# =============================================================

upstream daycraft_backend {
    # Round-robin by default
    server api-a:5000;
    server api-b:5000;
    server api-c:5000;

    # Keep connections alive to reduce TCP handshake overhead
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # =========================================================
    # Request Limits
    # =========================================================
    client_max_body_size 10M;

    # =========================================================
    # Timeouts
    # =========================================================
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # =========================================================
    # Logging
    # =========================================================
    access_log /var/log/nginx/daycraft_access.log;
    error_log  /var/log/nginx/daycraft_error.log;

    # =========================================================
    # Health Check (Load Balancer Level)
    # =========================================================
    location /lb-health {
        return 200 '{"status":"ok","service":"nginx-lb"}';
        add_header Content-Type application/json;
    }

    # =========================================================
    # API Routes → Backend Upstream
    # =========================================================
    location /api/ {
        proxy_pass http://daycraft_backend;

        # Pass real client info to backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # Connection keep-alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # CORS Headers
        add_header X-Served-By $upstream_addr always;
    }

    # =========================================================
    # Root / Health → Backend
    # =========================================================
    location / {
        proxy_pass http://daycraft_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
