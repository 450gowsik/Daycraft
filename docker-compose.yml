version: '3.8'

services:
  # =============================================================
  # MongoDB - Primary Database
  # =============================================================
  db:
    image: mongo:latest
    container_name: daycraft-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - daycraft-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================
  # Redis - Refresh Tokens, Caching, Rate Limiting
  # =============================================================
  redis:
    image: redis:7-alpine
    container_name: daycraft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - daycraft-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================
  # API Instance A
  # =============================================================
  api-a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daycraft-api-a
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://db:27017/daycraft
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=api-a
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - daycraft-network
    restart: unless-stopped

  # =============================================================
  # API Instance B
  # =============================================================
  api-b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daycraft-api-b
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://db:27017/daycraft
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=api-b
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - daycraft-network
    restart: unless-stopped

  # =============================================================
  # API Instance C
  # =============================================================
  api-c:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daycraft-api-c
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://db:27017/daycraft
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=api-c
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - daycraft-network
    restart: unless-stopped

  # =============================================================
  # Nginx Load Balancer
  # =============================================================
  nginx:
    image: nginx:alpine
    container_name: daycraft-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-a
      - api-b
      - api-c
    networks:
      - daycraft-network
    restart: unless-stopped

  # =============================================================
  # Frontend
  # =============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daycraft-frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - daycraft-network

networks:
  daycraft-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
